dataset_config:
  add_anomalies: true
  prob_insert: 1.0
  unknown_mask_value: 19

model_cfg:
  model:
    params:
      encoder_lr: 1e-5
      decoder_lr: 1e-4
      alpha: 1.0
    params:
      losses:
        - type: UnknownAwareLoss
          params:
            loss:
              type: DiceLoss
              params:
                average: "macro"
                ignore_index: 255
            unknown_label: 19
        - type: UnknownAwareLoss
          params:
            loss:
              type: PrototypicalGlobalLocalTripletLoss
              params:
                margin_global: 1.5
                margin_local: 0.5
                magnitude: 10
                num_classes: 19
                ignore_index: 255
            unknown_label: 19
        - type: ObjectosphereLoss
          params:
            xi: 5.0
            unknown_label: 19
            ignore_index: 255
training:
  wandb_base_run_name: "cityscapes_open"
  force_eval_mode: true

  train_transforms:
    type: Compose
    params:
      transforms:
        - type: LongestMaxSize 
          params:
            max_size: 1024
        - type: Normalize
          params:
            mean: [0.485, 0.456, 0.406]
            std: [0.229, 0.224, 0.225]
            max_pixel_value: 255.0
            p: 1.0
        - type: ToTensorV2
          params: 
            p: 1.0

  metrics:
    - type: MeanIoU
      params:
        num_classes: 19
        per_class: true
        ignore_index: 255 
    - type: AUPR
      params:
        unknown_label: 19

paths:
  checkpoint: checkpoints/cityscapes_closed_20251223_175807_val-mIoU_epoch_0.6693.pth