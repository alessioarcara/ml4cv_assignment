seed: 42

dataset_config:
  type: "streethazards"
  add_anomalies: false
  mask_shift: true

training:
  wandb_project_name: "ml4cv_assignment"
  wandb_entity: "aarcara"
  batch_size: 8
  lr: 1e-4
  weight_decay: 0.05
  num_epochs: 100
  evaluation_rate: 1
  use_mixed_precision: true 
  use_torch_compile: false 

  losses:
    - type: WeightedLoss
      params:
        loss:
          type: FocalLoss
          params:
            alpha: 1.0
            gamma: 2.0
            reduction: "mean"
        weight: 20.0
    - type: DiceLoss
      params:
        average: "macro"

  train_transforms:
    type: Compose
    params:
      transforms:
        - type: LongestMaxSize 
          params:
            max_size: 640

        # Geometric augmentations
        - type: HorizontalFlip
          params:
            p: 0.5

        # Occlusion augmentations
        - type: OneOf
          params:
            transforms:
              - type: CoarseDropout
                params:
                  num_holes_range: [1, 8]
                  p: 1.0
              - type: GridDropout
                params:
                  p: 0.5
              - type: Erasing 
                params:
                  p: 0.5
            p: 0.5

        # Color augmentations
        - type: OneOf
          params:
            transforms:
              - type: RandomBrightnessContrast
                params:
                  brightness_limit: 0.2
                  contrast_limit: 0.2
                  p: 0.8
              - type: ColorJitter
                params:
                  brightness: 0.2
                  contrast: 0.2
                  saturation: 0.2
                  hue: 0.1
                  p: 0.8
              - type: HueSaturationValue
                params:
                  hue_shift_limit: 20 
                  sat_shift_limit: 30
                  val_shift_limit: 20
                  p: 0.8
              - type: RandomGamma
                params:
                  gamma_limit: [80, 120]
                  p: 0.8
            p: 0.7
              
        # Weather augmentations
        - type: OneOf
          params:
            transforms:
              - type: RandomShadow 
                params:
                  p: 1.0
              - type: RandomSunFlare
                params:
                  p: 1.0
              - type: RandomRain
                params:
                  p: 1.0
            p: 0.2

        # Normalization & tensor conversion
        - type: Normalize
          params:
            mean: [0.485, 0.456, 0.406]
            std: [0.229, 0.224, 0.225]
            max_pixel_value: 255.0
            p: 1.0
        - type: ToTensorV2
          params: 
            p: 1.0
        
  val_transforms:
    type: Compose
    params:
      transforms:
        - type: LongestMaxSize 
          params:
            max_size: 640
        - type: Normalize
          params:
            mean: [0.485, 0.456, 0.406]
            std: [0.229, 0.224, 0.225]
            max_pixel_value: 255.0
            p: 1.0
        - type: ToTensorV2
          params: 
            p: 1.0

  metrics:
    - type: MeanIoU
      params:
        num_classes: 13
        per_class: true

  callbacks:
    - type: EarlyStoppingCallback
      params:
        patience: 10
        minimize: false
        history_key: "val/MeanIoU"
    - type: ModelSavingCallback
      params:
        out_dir: "checkpoints"  
        minimize: false
        history_key: "val/MeanIoU"
    - type: VisualizeSegmentationResultsCallback
      params: {}

paths:
  street_hazards_train_dir: "datasets/train"
  street_hazards_test_dir: "datasets/test"
  coco_data_dir: "datasets/coco"