seed: 42

wandb:
  project: "ML4CV_ASS"

model:
  encoder_name: "efficientnet_b2"
  d: 64
  stride: 8

training:
  img_height: 576 
  img_width: 1024 
  num_epochs: 50 
  evaluation_rate: 2
  batch_size: 4
  lr: 0.0004
  wd: 0.0001

losses:
  prototypical_triplet:
    anchors_magnitude: 10
    global: 1.5
    local: 0.5
  focal:
    alpha: 1
    gamma: 2
  objectosphere:
    xi: 5.0

paths:
  street_hazards_train_dir: "../datasets/train"
  street_hazards_test_dir: "../datasets/test"
  checkpoints_dir: "../saved/logs"
  coco_data_dir: "../datasets/coco"