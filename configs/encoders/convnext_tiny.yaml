training:
  wandb_base_run_name: "proto_segnet_convnext_tiny"

model_cfg:
  model:
    params:
      encoder:
        type: timm
        params:
          model_name: "convnext_tiny.dinov3_lvd1689m"
          features_only: true
          pretrained: true
          out_indices: [0, 3]
          output_stride: 8
          drop_path_rate: 0.1
      decoder:
        type: FaPNDecoder
        params:
          fpn_channels: [96, 768]
          decoder_channels: 64
          num_classes: 13
          input_size: [360, 640]
          output_stride: 8


